<!doctype html>
<html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f4e9"><title>Fresh Farm Eggs | Payment</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#263323;background:#f7f4e9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(100%,430px);background:white;border-radius:24px;padding:30px 24px;box-shadow:0 12px 40px #26332316;text-align:center}.egg{font-size:55px}h1{font-size:27px;margin:8px 0}.price{font-size:52px;font-weight:800;color:#3c692b;margin:8px 0}.muted{color:#64705f}.details{text-align:left;background:#f7f8f3;border-radius:16px;padding:16px;margin-top:22px}.item{margin-bottom:16px}.item:last-child{margin-bottom:0}.label{display:block;font-size:13px;color:#61705e;margin-bottom:6px}.value{font-size:17px;font-weight:650;overflow-wrap:anywhere}.line{display:flex;align-items:center;justify-content:space-between;gap:10px}button{border:0;border-radius:9px;background:#3c692b;color:white;padding:10px 13px;font-size:14px;font-weight:700;cursor:pointer;min-width:76px}button:focus-visible{outline:3px solid #e0a12d;outline-offset:2px}footer{font-size:14px;color:#64705f;margin-top:22px}small{display:block;margin-top:12px;color:#64705f}</style></head><body><main class="card"><div class="egg" aria-hidden="true">🥚</div><h1>Fresh Farm Eggs</h1><div class="price">$8.00</div><div class="muted">per dozen</div><section class="details" aria-label="Bank transfer details"><div class="item"><span class="label">Account name</span><div class="line"><span class="value">Nyree Biesiek</span><button type="button" data-copy="Nyree Biesiek">Copy</button></div></div><div class="item"><span class="label">ASB account number</span><div class="line"><span class="value">12-3135-0060936-12</span><button type="button" data-copy="12-3135-0060936-12">Copy</button></div></div><div class="item"><span class="label">Payment reference</span><div class="line"><span class="value">EGGS</span><button type="button" data-copy="EGGS">Copy</button></div></div></section><footer>Thanks for supporting our happy hens! 🐔</footer><small>Copy these details into your banking app to make a bank transfer. This page does not collect payments.</small></main><script>document.querySelectorAll('button[data-copy]').forEach(button=>button.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(button.dataset.copy);button.textContent='Copied!';setTimeout(()=>button.textContent='Copy',1800)}catch(e){button.textContent='Select text';}}));</script></body></html>
